name: Translator Frontend CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push Code to VPS and Build
        uses: appleboy/ssh-action@master
        with:
          host: 91.99.67.35
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e

            # Navigate to frontend project directory
            cd /var/www/Translator/HareKrishna-translator

            # Pull latest code
            git pull origin master

            # Install and build Angular app
            npm ci
            npm run build -- --configuration production

            # Ensure nginx can read build output
            sudo chown -R www-data:www-data /var/www/Translator/HareKrishna-translator/dist

            # Validate and reload nginx
            sudo nginx -t && sudo systemctl reload nginx

            echo "Frontend deployment successful"
