<div class="context-extractor-card">
  <h2>Ramayana Extractor (WisdomLib Bypass)</h2>

  <div class="row">
    <div class="col">
      <div class="form-group">
        <label>Paste Raw WisdomLib Content (Sanskrit + Transliteration)</label>
        <textarea
          rows="6"
          [(ngModel)]="rawWisdomlibText"
          placeholder="Paste the text here..."
        ></textarea>
      </div>
      <button class="btn btn-primary" (click)="extractFromRawText()">Extract Sloka</button>
    </div>
  </div>

  <div class="row" style="margin-top: 20px">
    <!-- English Side -->
    <div class="col half">
      <h3>English Context</h3>

      <div class="url-group" style="margin-bottom: 15px; display: flex; gap: 10px">
        <div class="form-group" style="flex: 2">
          <label>Canto Name</label>
          <input type="text" [(ngModel)]="cantoName" placeholder="e.g. Bala Kanda" />
        </div>
        <div class="form-group" style="flex: 1">
          <label>Canto No.</label>
          <input type="number" [(ngModel)]="cantoNumber" (ngModelChange)="onLocationChange()" />
        </div>
        <div class="form-group" style="flex: 1">
          <label>Chapter No.</label>
          <input type="number" [(ngModel)]="chapterNumber" (ngModelChange)="onLocationChange()" />
        </div>
        <div class="form-group" style="flex: 1">
          <label>Verse No.</label>
          <input type="number" [(ngModel)]="verseNumber" (ngModelChange)="onLocationChange()" />
        </div>
      </div>

      <div class="form-group">
        <label>Computed Sloka Number</label>
        <input type="text" [value]="slokaNumber" readonly style="background: #f3f4f6" />
      </div>

      <div class="form-group">
        <label>Sanskrit Sloka</label>
        <textarea rows="3" [(ngModel)]="sanskritSloka" readonly></textarea>
      </div>
      <div class="form-group">
        <label>Transliteration</label>
        <textarea rows="3" [(ngModel)]="slokaTransliteration" readonly></textarea>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" [(ngModel)]="generatePurport" /> Generate Purport (Optional)
        </label>
      </div>

      <button class="btn btn-warning" (click)="generateEnglish()" [disabled]="isGeneratingEnglish">
        {{ isGeneratingEnglish ? 'Generating...' : 'Generate English Content' }}
      </button>

      <div class="form-group" style="margin-top: 15px">
        <label>Word to Word Meaning (English)</label>
        <textarea rows="3" [(ngModel)]="wordToWordMeaning"></textarea>
      </div>
      <div class="form-group">
        <label>Translation (English)</label>
        <textarea rows="4" [(ngModel)]="translation"></textarea>
      </div>
      @if (generatePurport) {
        <div class="form-group">
          <label>Purport (English)</label>
          <textarea rows="6" [(ngModel)]="purport"></textarea>
        </div>
      }

      <button
        class="btn btn-success"
        (click)="translateToTamil()"
        [disabled]="isTranslatingTamil || !translation"
        style="margin-top: 10px"
      >
        {{ isTranslatingTamil ? 'Translating...' : 'Translate to Tamil' }}
      </button>
    </div>

    <!-- Tamil Side -->
    <div class="col half">
      <h3>Tamil Context</h3>
      <div class="url-group" style="margin-bottom: 15px; display: flex; gap: 10px">
        <div class="form-group" style="flex: 2">
          <label>Canto Name (Tamil)</label>
          <input type="text" [(ngModel)]="tamilCantoName" placeholder="e.g. பால காண்டம்" />
        </div>
        <div class="form-group" style="flex: 1">
          <label>Canto No.</label>
          <input type="number" [(ngModel)]="cantoNumber" readonly style="background: #f3f4f6" />
        </div>
        <div class="form-group" style="flex: 1">
          <label>Chapter No.</label>
          <input type="number" [(ngModel)]="chapterNumber" readonly style="background: #f3f4f6" />
        </div>
        <div class="form-group" style="flex: 1">
          <label>Verse No.</label>
          <input type="number" [(ngModel)]="verseNumber" readonly style="background: #f3f4f6" />
        </div>
      </div>
      <div class="form-group">
        <label>Computed Sloka Number (Tamil)</label>
        <input
          type="text"
          [value]="tamilSlokaNumberComputed"
          readonly
          style="background: #f3f4f6"
        />
      </div>
      <div class="form-group">
        <label>Sanskrit Sloka</label>
        <textarea rows="3" [(ngModel)]="tamilSanskritSloka"></textarea>
      </div>
      <div class="form-group">
        <label>Transliteration (Tamil)</label>
        <textarea rows="3" [(ngModel)]="tamilSlokaTransliteration"></textarea>
      </div>
      <div class="form-group">
        <label>Word to Word Meaning (Tamil)</label>
        <textarea rows="3" [(ngModel)]="tamilWordToWordMeaning"></textarea>
      </div>
      <div class="form-group">
        <label>Translation (Tamil)</label>
        <textarea rows="4" [(ngModel)]="tamilTranslation"></textarea>
      </div>
      @if (generatePurport) {
        <div class="form-group">
          <label>Purport (Tamil)</label>
          <textarea rows="6" [(ngModel)]="tamilPurport"></textarea>
        </div>
      }

      <button
        class="btn btn-primary"
        (click)="saveToDatabase()"
        style="margin-top: 10px; width: 100%"
      >
        Save Context to Database
      </button>
    </div>
  </div>

  @if (statusMessage) {
    <div class="status-message" [ngClass]="{ error: isError, success: !isError }">
      {{ statusMessage }}
    </div>
  }
</div>
