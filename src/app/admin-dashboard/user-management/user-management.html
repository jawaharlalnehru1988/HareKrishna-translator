<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>👥 User Management</h1>
    <p>Approve new editors so they can log in.</p>
  </div>

  <div class="card glass-card">
    <table class="user-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Role</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.role }}</td>
          <td>
            <span class="status-badge" [class.approved]="user.approved" [class.pending]="!user.approved">
              {{ user.approved ? 'Approved' : 'Pending' }}
            </span>
          </td>
          <td>
            <button *ngIf="!user.approved" class="primary-btn small-btn" (click)="approveUser(user.id)">
              Approve
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
