<div class="auth-container">
  <div class="auth-card glass-card">
    <h2>Editor Signup</h2>
    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" class="form-control" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" class="form-control" />
        <button class="eye-icon" (click)="togglePasswordVisibility()">
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="password-wrapper">
        <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" class="form-control" />
        <button class="eye-icon" (click)="toggleConfirmPasswordVisibility()">
          {{ showConfirmPassword ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>
    <button (click)="signup()" class="primary-btn" [disabled]="!username || !password || password !== confirmPassword">Sign Up</button>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <p>Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
