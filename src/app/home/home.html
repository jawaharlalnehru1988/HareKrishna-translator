<div class="hero-section">
    <h1 class="hero-title">Restore the Purity of Divine Translations</h1>
    <p class="hero-subtitle">An AI-powered tool to refine and perfect translations from Sanskrit and Hindi to English.
    </p>

    <div class="hero-buttons">
        <button class="primary-btn" routerLink="/translator">Start Translating</button>
        <button class="secondary-btn">View Guidelines</button>
    </div>

    <div class="module-grid">
        @for (module of modules; track module.title) {
            <div class="module-card" [routerLink]="module.route" [style.--accent]="module.color">
                <div class="card-icon">{{ module.icon }}</div>
                <div class="card-content">
                    <h3>{{ module.title }}</h3>
                    <p>{{ module.description }}</p>
                </div>
                <div class="card-arrow">→</div>
            </div>
        }
    </div>
</div>
